name: credential-expiry

# Goes red 45 days before a credential the game depends on expires, so the
# failure email (scheduled runs mail whoever last edited the schedule) comes
# with time to rotate. Nothing reads these from the provider: the dates are
# written here when a credential is made or rotated (docs/ops-notes.md,
# "Credentials that expire"), and they're conservative (made + 1 year from the
# commit that created it, so the real expiry can only be later).
on:
  schedule:
    - cron: "23 6 1 * *"   # the 1st of every month
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Expiry dates
        env:
          # date | credential | what breaks when it expires
          CREDENTIALS: |
            2027-10-09|GitHub PAT GITHUB_TOKEN (HCP workspace berries-handover/handover-infra)|every Terraform plan (it reads the Actions secrets)
            2027-10-18|Access service token handover-ci-tf (infra/github.tf)|deploy, backup, rebuild: CI can't SSH through Access
            2027-10-19|Access service token oke-prometheus (infra/metrics.tf)|scraping and Grafana's player view: both "down" alerts fire, host is fine
          WARN_DAYS: 45
        run: |
          now=$(date -u +%s); bad=0
          while IFS='|' read -r day what breaks; do
            [ -n "$day" ] || continue
            left=$(( ($(date -u -d "$day" +%s) - now) / 86400 ))
            if [ "$left" -le "$WARN_DAYS" ]; then
              echo "::error::$what expires $day ($left days): $breaks. Rotate it (docs/ops-notes.md, Credentials that expire), then update the date here."
              bad=1
            else
              echo "ok  $day  ${left}d  $what"
            fi
          done <<< "$CREDENTIALS"
          exit "$bad"
