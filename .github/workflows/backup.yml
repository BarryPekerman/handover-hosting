name: backup

# Nightly copy of what exists only on the host: the leaderboard DB. (The
# tunnel lives in Terraform now; the host holds only its run token, which is a
# secret.) Encrypted with BACKUP_PASSPHRASE before it leaves the runner, then
# uploaded to the private OCI bucket handover-backups (infra/storage.tf) as
# handover-backup, which can add objects but not delete or overwrite them; the
# bucket deletes each after 30 days. restore-test.yml checks monthly that the
# newest one decrypts and opens. Restore: docs/ops-notes.md.
on:
  schedule:
    - cron: "17 2 * * *"     # 02:17 UTC, a quiet hour
  workflow_dispatch:

concurrency: backup

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SSH to the host through the Cloudflare tunnel
        uses: ./.github/actions/tunnel-ssh
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      # sqlite's backup API gives a consistent copy while the spawner writes.
      - name: Collect and encrypt
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          umask 077
          ssh handover 'set -euo pipefail
            d=$(mktemp -d); trap "rm -rf $d" EXIT
            # the DB belongs to the spawner user; read it as root, hand the copy to ubuntu
            sudo python3 -c "import sqlite3, sys; s = sqlite3.connect(sys.argv[1]); t = sqlite3.connect(sys.argv[2]); s.backup(t); t.close()" \
              /var/lib/handover/handover-leaderboard.db "$d/handover-leaderboard.db"
            sudo chown ubuntu: "$d/handover-leaderboard.db"
            tar czf - -C "$d" .' > backup.tgz
          tar tzf backup.tgz > /dev/null
          echo "archive: $(stat -c %s backup.tgz) bytes, $(tar tzf backup.tgz | grep -vc '/$') files"
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "handover-backup-$(date -u +%F).tgz.gpg" backup.tgz
          shred -u backup.tgz

      - name: Install the OCI CLI (pinned)
        run: python3 -m pip install --user "oci-cli==3.77.0"

      # A new name every run (date + run id), so nothing is ever overwritten
      - name: Upload to the backup bucket
        env:
          OCI_NS: ${{ secrets.OCI_BACKUP_NAMESPACE }}
          OCI_CLI_USER: ${{ secrets.OCI_BACKUP_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_BACKUP_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_BACKUP_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_BACKUP_KEY_CONTENT }}
          OCI_CLI_REGION: il-jerusalem-1
          RUN_ID: ${{ github.run_id }}
        run: |
          f=(handover-backup-*.tgz.gpg)
          name="${f[0]%.tgz.gpg}-$RUN_ID.tgz.gpg"
          "$HOME/.local/bin/oci" os object put -bn handover-backups -ns "$OCI_NS" --name "$name" --file "${f[0]}" --no-overwrite \
            --metadata "{\"run-id\": \"$RUN_ID\", \"commit\": \"$GITHUB_SHA\"}" > /dev/null
          echo "uploaded $name ($(stat -c %s "${f[0]}") bytes)"

      # For the HandoverBackupStale alert (oke-gitops): node-exporter's textfile
      # collector publishes when the last backup was uploaded.
      - name: Record the successful backup
        run: |
          ssh handover 'set -euo pipefail
            f=/var/lib/prometheus/node-exporter/handover_backup.prom
            printf "# HELP handover_backup_last_success_timestamp_seconds When the nightly backup was last uploaded.\n# TYPE handover_backup_last_success_timestamp_seconds gauge\nhandover_backup_last_success_timestamp_seconds %s\n" "$(date +%s)" |
              sudo tee "$f.tmp" > /dev/null
            sudo mv "$f.tmp" "$f"'
