name: terraform

# Infra (infra/) runs in Terraform Cloud: org berries-handover, project handover,
# workspace handover-infra (remote execution, OCI creds as workspace variables).
#   - PR touching infra/  -> speculative plan (never applies), summary on the run page
#   - manual dispatch     -> plan, then apply only if the plan has changes.
#     Starting it is the approval:
#       gh workflow run terraform.yml -R BarryPekerman/handover-hosting
on:
  pull_request:
    paths: ["infra/**"]
  workflow_dispatch:
  workflow_call:       # rebuild.yml runs the apply as one step of a rebuild
    secrets:
      TF_API_TOKEN: { required: true }

concurrency: terraform

permissions:
  contents: read

env:
  TF_CLOUD_ORGANIZATION: berries-handover
  TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
  TF_WORKSPACE: handover-infra
  CONFIG_DIRECTORY: ./   # repo root: the workspace sets working directory infra/

jobs:
  terraform:
    runs-on: ubuntu-24.04
    env:
      SPECULATIVE: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/tfc-workflows-github/actions/upload-configuration@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        id: upload
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: ${{ env.CONFIG_DIRECTORY }}
          speculative: ${{ env.SPECULATIVE }}
      - uses: hashicorp/tfc-workflows-github/actions/create-run@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        id: run
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          plan_only: ${{ env.SPECULATIVE }}
          message: "gh: ${{ github.sha }} by ${{ github.actor }}"
      - uses: hashicorp/tfc-workflows-github/actions/plan-output@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        id: out
        with:
          plan: ${{ fromJSON(steps.run.outputs.payload).data.relationships.plan.data.id }}
      # A no-change plan is left alone (TFC marks it planned_and_finished).
      - uses: hashicorp/tfc-workflows-github/actions/apply-run@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        if: env.SPECULATIVE == 'false' && fromJSON(steps.run.outputs.payload).data.attributes.actions.IsConfirmable
        with:
          run: ${{ steps.run.outputs.run_id }}
          comment: "applied from GitHub run ${{ github.run_id }}"
      - name: Summary
        env:
          ADD: ${{ steps.out.outputs.add }}
          CHANGE: ${{ steps.out.outputs.change }}
          DESTROY: ${{ steps.out.outputs.destroy }}
          LINK: ${{ steps.run.outputs.run_link }}
        run: |
          {
            if [ "$SPECULATIVE" = true ]; then echo "### Terraform plan (speculative)"; else echo "### Terraform plan/apply"; fi
            echo "add $ADD, change $CHANGE, destroy $DESTROY"
            echo "[run in Terraform Cloud]($LINK)"
          } >> "$GITHUB_STEP_SUMMARY"
