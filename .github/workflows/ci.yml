name: ci

# Cheap checks on every push; deploying is deploy.yml, started by hand.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Spawner compiles
        run: python3 -m py_compile spawner/*.py
      # aiohttp pinned to the host's version (Ubuntu 24.04's python3-aiohttp).
      # pyflakes rules: undefined names, unused imports, shadowed definitions.
      - name: Python lint
        run: |
          python3 -m pip install --user "ruff==0.6.9"
          python3 -m ruff check --select F,E9 spawner scripts tests
      # Coverage is reported, with a floor so it can't quietly drop. spawner.py's
      # box lifecycle and proxy need Incus; tests/vm covers those against a VM.
      - name: Spawner unit tests
        run: |
          python3 -m pip install --user "pytest==9.1.1" "pytest-cov==5.0.0" "aiohttp==3.9.1"
          python3 -m pytest -q tests/test_*.py --cov=spawner --cov=scripts --cov-report=term-missing --cov-fail-under=77
      # The tests' own check: each line of mutations.sh plants a known bug and
      # the unit tests must fail on it. A test that stops catching its bug, or a
      # line whose code moved (STALE), fails CI. About a minute.
      - name: Planted bugs are caught
        run: PY=python3 tests/mutations.sh
      # The host runs aiohttp 3.9.1 (above); this catches what the next aiohttp
      # deprecates or breaks before the host's Ubuntu ships it. Deprecation
      # warnings fail here.
      - name: Unit tests on the newest aiohttp
        run: |
          python3 -m pip install --user --upgrade aiohttp
          python3 -c "import aiohttp; print('aiohttp', aiohttp.__version__)"
          python3 -m pytest -q -W error::DeprecationWarning tests/test_*.py
      - name: Install Ansible + ansible-lint (pinned)
        run: python3 -m pip install --user "ansible-core==2.21.5" "ansible-lint==26.9.0"
      - name: Host playbook lints
        run: ansible-lint host/site.yml
