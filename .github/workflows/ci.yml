name: ci

# Cheap checks on every push; deploying is deploy.yml, started by hand.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Spawner compiles
        run: python3 -m py_compile spawner/spawner.py
      # aiohttp pinned to the host's version (Ubuntu 24.04's python3-aiohttp).
      - name: Spawner unit tests
        run: |
          python3 -m pip install --user "pytest==9.1.1" "aiohttp==3.9.1"
          python3 -m pytest -q tests/test_spawner.py tests/test_results.py
      - name: Install Ansible + ansible-lint (pinned)
        run: python3 -m pip install --user "ansible-core==2.21.5" "ansible-lint==26.9.0"
      - name: Host playbook lints
        run: ansible-lint host/site.yml
