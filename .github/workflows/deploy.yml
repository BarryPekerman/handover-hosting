name: deploy

# Applies the host config (host/site.yml: packages, sysctls, fail2ban, Incus
# pool + isolated profile, tunnel config, systemd units), then redeploys the
# spawner and injects the app secrets from GitHub Secrets. The hostile game box is never a secrets
# client: CD (trusted) pushes a rendered env file to it. Swap GitHub Secrets for
# HashiCorp Vault here later without touching the host (box never calls Vault).
#
# Manual on purpose: starting it is the approval for a production deploy.
#   gh workflow run deploy.yml -R BarryPekerman/handover-hosting
# Pushes to master only run the checks in ci.yml.
on:
  workflow_dispatch:
  workflow_call:       # rebuild.yml runs it as one step of a rebuild
    secrets:
      DEPLOY_SSH_KEY: { required: true }
      DEPLOY_KNOWN_HOSTS: { required: true }
      CF_ACCESS_CLIENT_ID: { required: true }
      CF_ACCESS_CLIENT_SECRET: { required: true }
      CF_TUNNEL_TOKEN: { required: true }
      TURNSTILE_SITEKEY: { required: true }
      TURNSTILE_SECRET: { required: true }
      GH_CLIENT_SECRET: { required: true }
      SESSION_SECRET: { required: true }

concurrency: deploy        # never overlap two deploys

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: SSH to the host through the Cloudflare tunnel
        uses: ./.github/actions/tunnel-ssh
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Install Ansible (pinned)
        run: python3 -m pip install --user "ansible-core==2.21.5"

      - name: Host config
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          ansible-playbook -i handover, --diff host/site.yml

      - name: Copy spawner
        run: scp spawner/spawner.py handover:~/spawner.py

      - name: Inject secrets, restart (non-destructive)
        env:
          TS: ${{ secrets.TURNSTILE_SECRET }}
          TK: ${{ secrets.TURNSTILE_SITEKEY }}
          GH: ${{ secrets.GH_CLIENT_SECRET }}
          SS: ${{ secrets.SESSION_SECRET }}
        run: |
          # A secret without its sitekey would make every Play fail the bot check.
          if [ -z "$TK" ] || [ -z "$TS" ]; then echo "::error::Turnstile sitekey/secret missing"; exit 1; fi
          # secrets travel over stdin, never in the host's process args
          printf 'TURNSTILE_SITEKEY=%s\nTURNSTILE_SECRET=%s\nGH_CLIENT_SECRET=%s\nSESSION_SECRET=%s\n' "$TK" "$TS" "$GH" "$SS" \
            | ssh handover '
            umask 077
            cat > /home/ubuntu/handover-spawner.env
            chmod 600 /home/ubuntu/handover-spawner.env
            sudo systemctl restart handover-spawner
            sleep 2
            echo "health: $(curl -s 127.0.0.1:8080/healthz)"
          '
