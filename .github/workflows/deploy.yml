name: deploy

# Applies the host config (host/site.yml: packages, sysctls, fail2ban, Incus
# pool + isolated profile, systemd units), then redeploys the spawner and the
# tunnel config and injects the app secrets from GitHub Secrets. The hostile game box is never a secrets
# client: CD (trusted) pushes a rendered env file to it. Swap GitHub Secrets for
# HashiCorp Vault here later without touching the host (box never calls Vault).
#
# Manual on purpose: starting it is the approval for a production deploy.
#   gh workflow run deploy.yml -R BarryPekerman/handover-hosting
# Pushes to master only run the checks in ci.yml.
on:
  workflow_dispatch:

concurrency: deploy        # never overlap two deploys

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # This repo's own deploy key (handover-hosting/host/deploy-keys), and the
      # host key pinned in a secret instead of trusted from ssh-keyscan.
      - name: Set up SSH to the host
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Install Ansible (pinned)
        run: python3 -m pip install --user "ansible-core==2.21.5"

      - name: Host config
        run: |
          ansible-playbook -i "$HOST," -u ubuntu --private-key ~/.ssh/id --diff host/site.yml

      - name: Copy spawner and tunnel config
        run: |
          scp -i ~/.ssh/id spawner/spawner.py      ubuntu@"$HOST":~/spawner.py
          scp -i ~/.ssh/id cloudflared/config.yml  ubuntu@"$HOST":~/.cloudflared/config.yml

      - name: Inject secrets, restart (non-destructive)
        env:
          TS: ${{ secrets.TURNSTILE_SECRET }}
          GH: ${{ secrets.GH_CLIENT_SECRET }}
          SS: ${{ secrets.SESSION_SECRET }}
        run: |
          # secrets travel over stdin, never in the host's process args
          printf 'TURNSTILE_SECRET=%s\nGH_CLIENT_SECRET=%s\nSESSION_SECRET=%s\n' "$TS" "$GH" "$SS" \
            | ssh -i ~/.ssh/id ubuntu@"$HOST" '
            umask 077
            cat > /home/ubuntu/handover-spawner.env
            chmod 600 /home/ubuntu/handover-spawner.env
            sudo systemctl restart handover-spawner
            sleep 2
            echo "health: $(curl -s 127.0.0.1:8080/healthz)"
          '
