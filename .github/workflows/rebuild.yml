name: rebuild

# The whole host, from code, in one approval:
#   gh workflow run rebuild.yml -R BarryPekerman/handover-hosting
# infra (terraform apply) -> reach (tunnel up, ssh works) -> host (deploy.yml:
# playbook + spawner) -> image (the-handover-linux-ctf's deploy-image: the newest
# tested image in the handover-images bucket) -> verify. Safe on a healthy host too: each step is
# idempotent (a no-op plan, an image that's already live).
#
# Two runs, one click: GitHub hands a run its secrets when it starts, and the
# infra step (re)writes several (service token, host key, tunnel token). So
# after infra, this run starts a second run with stage=host, which gets the
# fresh secrets, and waits for it (found in drill B: from scratch, the later
# jobs saw the secrets as they were before the apply -- empty).
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "all (default) | host: skip infra, run reach -> host -> image -> verify"
        required: false
        default: all

concurrency: rebuild

permissions:
  contents: read

jobs:
  infra:
    if: inputs.stage != 'host'
    uses: ./.github/workflows/terraform.yml
    secrets:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}

  continue:
    needs: infra
    if: inputs.stage != 'host'
    runs-on: ubuntu-24.04
    permissions:
      actions: write    # start the stage=host run
    steps:
      - name: Run the host stage with fresh secrets, and wait for it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          before=$(gh run list -R "$REPO" -w rebuild.yml -L 1 --json databaseId -q '.[0].databaseId // 0')
          gh workflow run rebuild.yml -R "$REPO" --ref "$GITHUB_REF_NAME" -f stage=host
          for _ in $(seq 30); do
            id=$(gh run list -R "$REPO" -w rebuild.yml -L 1 --json databaseId -q '.[0].databaseId // 0')
            [ "$id" != "$before" ] && [ "$id" != "$GITHUB_RUN_ID" ] && break
            sleep 4
          done
          [ "$id" != "$before" ] && [ "$id" != "$GITHUB_RUN_ID" ] || { echo "::error::host stage didn't start"; exit 1; }
          echo "host stage: https://github.com/$REPO/actions/runs/$id" | tee -a "$GITHUB_STEP_SUMMARY"
          gh run watch "$id" -R "$REPO" --exit-status

  reach:
    if: inputs.stage == 'host'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait until the host is reachable through the tunnel
        uses: ./.github/actions/tunnel-ssh
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          wait-seconds: "900"   # a new instance: boot + cloud-init + tunnel

  host:
    needs: reach
    permissions:
      contents: read
      actions: read     # deploy.yml checks the commit passed ci
    uses: ./.github/workflows/deploy.yml
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
      TURNSTILE_SITEKEY: ${{ secrets.TURNSTILE_SITEKEY }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

  image:
    needs: host
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.REBUILD_GH_TOKEN }}   # Actions read/write on the-handover-linux-ctf only
      REPO: BarryPekerman/the-handover-linux-ctf
    steps:
      # deploy-image with no run_id ships the newest image the-handover-linux-ctf's ci
      # stored in the handover-images bucket (infra/storage.tf). If the bucket
      # has none (its "Pick" step failed), build one now, tests included, and
      # ship that; any other failure fails the rebuild.
      - name: Ship the-handover-linux-ctf's latest tested image
        run: |
          start_and_wait() {   # <workflow> [-f k=v...]: dispatch on main, wait, print the run id (also on failure)
            local wf=$1; shift
            local before id
            before=$(gh run list -R "$REPO" -w "$wf" -L 1 --json databaseId -q '.[0].databaseId // 0')
            gh workflow run "$wf" -R "$REPO" --ref main "$@" >&2   # --ref: the token can't look up the default branch
            for _ in $(seq 30); do
              id=$(gh run list -R "$REPO" -w "$wf" -L 1 --json databaseId -q '.[0].databaseId // 0')
              [ "$id" != "$before" ] && break
              sleep 4
            done
            [ "$id" != "$before" ] || { echo "::error::$wf didn't start" >&2; exit 1; }
            echo "$wf: https://github.com/$REPO/actions/runs/$id" >&2
            echo "$id"
            gh run watch "$id" -R "$REPO" --exit-status >&2 || return 1
          }
          failed_step() {   # <run id>: name of the first failed step
            gh run view "$1" -R "$REPO" --json jobs -q '[.jobs[].steps[] | select(.conclusion == "failure") | .name][0] // ""'
          }
          if ! id=$(start_and_wait deploy-image.yml); then
            if [ -z "$id" ] || [ "$(failed_step "$id")" != "Pick the stored image" ]; then
              echo "::error::deploy-image failed"; exit 1
            fi
            echo "no stored tested image: building one (tests included)"
            start_and_wait ci.yml >/dev/null
            start_and_wait deploy-image.yml >/dev/null
          fi

  verify:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read   # the Timing step reads this run's job durations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tunnel-ssh
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - name: The game answers and a player box starts
        run: |
          curl -fsS https://play.barrypekerman.com/healthz
          echo
          scp tests/vm/smoke-box.sh handover:/tmp/smoke-box.sh
          ssh handover 'bash /tmp/smoke-box.sh </dev/null; rc=$?; rm -f /tmp/smoke-box.sh; exit $rc'
      - name: Timing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Rebuild timing"
            gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --json jobs \
              -q '.jobs[] | select(.status == "completed") | "- \(.name): \((((.completedAt | fromdate) - (.startedAt | fromdate)) / 60 | floor))m \((((.completedAt | fromdate) - (.startedAt | fromdate)) % 60))s"'
          } >> "$GITHUB_STEP_SUMMARY"
