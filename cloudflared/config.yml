# cloudflared config for the Handover tunnel.
# credentials-file holds the tunnel UUID's secret (host-local, git-ignored).
tunnel: ff6fc525-6791-4d75-aec0-a652197aaee2
credentials-file: /home/ubuntu/.cloudflared/ff6fc525-6791-4d75-aec0-a652197aaee2.json

ingress:
  - hostname: play.barrypekerman.com
    service: http://localhost:8080
  # Admin + CI SSH, behind Cloudflare Access (app handover-ssh: your email, or
  # the handover-ci service token). Public port 22 is closed.
  - hostname: handover-ssh.barrypekerman.com
    service: ssh://localhost:22
  - service: http_status:404
