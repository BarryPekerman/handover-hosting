#cloud-config
# First boot only does the minimum. Everything the host needs (packages, Incus
# pool + isolated profile, sysctls, fail2ban, systemd units) is host/site.yml,
# which deploy.yml applies on every deploy, so a fresh box and the live box are
# configured by the same code. No secrets here either.
#
# After `terraform apply` creates a box:
#   1. update the DEPLOY_HOST secret (both repos) if the IP changed
#   2. gh workflow run deploy.yml -R BarryPekerman/handover-hosting
#      (host config + spawner; Incus has to exist before an image can land)
#   3. gh workflow run deploy-image.yml -R BarryPekerman/bandit-wannabe -f run_id=<latest passing ci on main>
#   Tunnel credentials for a fresh box are still a manual step (infra/README.md).
package_update: true
package_upgrade: true
final_message: "Handover host up. Run deploy.yml (host config + spawner), then deploy-image."
