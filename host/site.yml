---
# Host config for the Handover box (OCI A1, Ubuntu 24.04 ARM): everything the
# spawner and player containers rely on, applied by deploy.yml before the
# spawner is copied. Idempotent: on the live box a run reports no changes.
#
#   ansible-playbook -i <host>, -u ubuntu --private-key <key> host/site.yml --check --diff
#
# Not here: the spawner code, tunnel config and secrets (deploy.yml), the game
# image (bandit-wannabe's deploy-image), the instance itself (infra/).
- name: Handover host
  hosts: all
  become: true
  # Run pending handlers even if a later task fails: otherwise a change made
  # before the failure (e.g. a sysctl file) is never applied, and the next run
  # sees the file unchanged and doesn't apply it either.
  force_handlers: true
  vars:
    cloudflared_version: "2026.10.1"
    # Run token for the Terraform-made tunnel (infra/tunnel.tf). deploy.yml
    # passes it from the CF_TUNNEL_TOKEN secret; when absent (e.g. a dry run
    # from a laptop) the connector tasks are skipped.
    tunnel_token: "{{ lookup('ansible.builtin.env', 'CF_TUNNEL_TOKEN') }}"
    pool_size: 30GiB
    isolated_profile:
      config:
        limits.cpu.allowance: 50%
        # 60 players x 320 MiB = 18.75 GiB of the host's 23.4 GiB, so even
        # every box at its limit can't run the host (no swap) out of memory.
        # A whole game played in one box peaks at 231 MiB even squeezed to
        # 256 MiB (measured 2026-10-20, scripts/footprint.sh).
        limits.memory: 320MiB
        limits.processes: "300"
        # The game never uses /dev/incus/sock; it would leak the host name.
        security.guestapi: "false"
        # Each box its own uid range: per-uid host limits (inotify) aren't
        # shared across boxes, and an escape lands in no other box's uids.
        security.idmap.isolated: "true"
        # No user namespaces inside a box: unshare -U is the usual way in to
        # nf_tables and the other namespaced-capability kernel bugs. The game
        # needs none (solver, leak scan and 21 nested user managers pass).
        # Applies to boxes started after the change.
        linux.sysctl.user.max_user_namespaces: "0"
      devices:
        eth0: { type: none }        # no NIC: isolation by absence
        # btrfs enforces this on what the box *references*, which includes the
        # ~0.95 GiB base image it shares with every box. So the size is base +
        # the player's room: 1400 MiB leaves ~420 MiB writable. On disk a box
        # only adds its own writes (a whole game: 93 MiB), so 60 x 420 MiB
        # worst case + one base image (~26 GiB) fits the 30 GiB pool.
        root: { path: /, pool: games, size: 1400MiB, type: disk }
    # The spawner's Incus project. Its certificate is trusted for this project
    # only, and restricted=true makes Incus refuse what a compromised spawner
    # could use against the host: privileged, nested or shared-idmap boxes,
    # disks outside a pool, NICs, proxy/unix/gpu devices, raw.lxc, server and
    # project changes (break-tested on Incus 6.0.0, 2026-10-23). Images are the
    # default project's (deploy-image puts them there) and read-only from here.
    # features.* only take effect when the project is created.
    handover_project:
      config:
        features.images: "false"
        features.networks: "false"
        features.profiles: "true"
        features.storage.buckets: "true"
        features.storage.volumes: "true"
        restricted: "true"
        restricted.containers.nesting: block
        restricted.containers.privilege: isolated
        restricted.devices.disk: managed
        restricted.devices.nic: block
        # MAX_PLAYERS (60) + WARM_SPARES (3): a spawner bug can't overrun the host
        limits.instances: "63"
      description: The Handover's player boxes (spawner only)

  handlers:
    - name: Apply sysctls
      ansible.builtin.command: sysctl --system
      changed_when: true

    - name: Restart fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Create launch lock
      ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/handover.conf
      changed_when: true

    - name: Restart node exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        state: restarted

    - name: Restart tunnel connector
      ansible.builtin.systemd:
        name: cloudflared-tf
        state: restarted
        daemon_reload: true

  tasks:
    - name: Packages
      ansible.builtin.apt:
        name: [incus, incus-client, btrfs-progs, ttyd, python3-aiohttp, fail2ban]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Cloudflared (pinned)
      ansible.builtin.apt:
        deb: "https://github.com/cloudflare/cloudflared/releases/download/{{ cloudflared_version }}/cloudflared-linux-arm64.deb"
      notify: Restart tunnel connector

    # Every nested `ssh levelN@localhost` starts a systemd user manager; the
    # stock 128 inotify instances run out by about level 2. ptrace_scope and
    # dmesg_restrict can't be set inside a container, so the host enforces them.
    # The rest closes kernel interfaces exploits favour to players (box root
    # is unprivileged on the host): io_uring only for real root (incusd uses
    # it; ttyd falls back to plain I/O, tested), and bpf and userfaultfd pinned
    # to Ubuntu's defaults so a changed default can't reopen them. The whole
    # game was solved with these on (2026-10-23).
    - name: Sysctls
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-handover.conf
        mode: "0644"
        content: |
          fs.inotify.max_user_instances = 8192
          fs.inotify.max_user_watches = 524288
          kernel.yama.ptrace_scope = 1
          kernel.dmesg_restrict = 1
          kernel.io_uring_disabled = 1
          kernel.unprivileged_bpf_disabled = 2
          vm.unprivileged_userfaultfd = 0
      notify: Apply sysctls

    # SSH is key-only, so this is about log noise and connection churn.
    - name: Fail2ban sshd jail
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        mode: "0644"
        content: |
          [sshd]
          enabled  = true
          backend  = systemd
          maxretry = 5
          findtime = 10m
          bantime  = 1h
      notify: Restart fail2ban

    - name: Fail2ban running
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started

    # Pulled in as a dependency; nothing uses RPC and it's a reflection vector.
    # Masked even where it isn't installed (a plain Ubuntu image), so a later
    # install can't start it. The systemd module fails on a missing unit,
    # hence systemctl (noqa below).
    - name: Look for rpcbind
      ansible.builtin.command: systemctl is-enabled rpcbind.service rpcbind.socket  # noqa: command-instead-of-module
      register: rpcbind
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Rpcbind off
      ansible.builtin.command: systemctl mask --now rpcbind.service rpcbind.socket  # noqa: command-instead-of-module
      when: rpcbind.stdout_lines != ["masked", "masked"]
      changed_when: true

    # The ttyd package enables its own service: a host `login` prompt on
    # 127.0.0.1:7681. Nothing uses it (the spawner runs one ttyd per box).
    - name: Packaged ttyd service off
      ansible.builtin.systemd:
        name: ttyd.service
        state: stopped
        enabled: false
        masked: true

    # One key per repo's deploy workflow, so a leaked key is revoked by deleting
    # one file here, without touching the admin key. Keys only added, never
    # removed by omission: drop a file to revoke it (and the task's loop entry).
    - name: Deploy keys
      ansible.builtin.lineinfile:
        path: /home/ubuntu/.ssh/authorized_keys
        line: "{{ lookup('file', 'deploy-keys/' + item + '.pub') }}"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      loop: [bandit-wannabe, handover-hosting]

    # The admin and CI login (deploy, image switch); never the spawner, which
    # runs as `handover` with a project-restricted certificate (below).
    - name: Ubuntu manages Incus
      ansible.builtin.user:
        name: ubuntu
        groups: incus-admin
        append: true

    - name: Incus is initialised
      ansible.builtin.command: incus admin init --minimal
      args:
        creates: /var/lib/incus/storage-pools/default

    - name: Look for the games pool
      ansible.builtin.command: incus storage show games
      register: games_pool
      changed_when: false
      failed_when: games_pool.rc not in [0, 1]
      check_mode: false

    # btrfs: per-container disk quotas, and clones share the base image.
    - name: Games pool
      ansible.builtin.command: incus storage create games btrfs size={{ pool_size }}
      when: games_pool.rc != 0
      changed_when: true

    - name: Look for the handover project
      ansible.builtin.command: incus project show handover
      register: project
      changed_when: false
      failed_when: project.rc not in [0, 1]
      check_mode: false

    - name: Handover project exists
      ansible.builtin.command: >-
        incus project create handover
        {% for k, v in handover_project.config.items() if k.startswith('features.') %} -c {{ k }}={{ v }}{% endfor %}
      when: project.rc != 0
      changed_when: true

    - name: Handover project matches
      ansible.builtin.command:
        cmd: incus project edit handover
        stdin: "{{ handover_project | to_nice_yaml }}"
      when: >-
        project.rc != 0 or
        (project.stdout | from_yaml).config != handover_project.config or
        (project.stdout | from_yaml).description != handover_project.description
      changed_when: true

    # The same profile in both projects: player boxes use the handover one;
    # bandit-wannabe's switch-image.sh warms each new image with the default
    # project's.
    - name: Look for the isolated profiles
      ansible.builtin.command: incus profile show isolated --project {{ item }}
      register: profile
      changed_when: false
      failed_when: profile.rc not in [0, 1]
      check_mode: false
      loop: [default, handover]

    - name: Isolated profiles exist
      ansible.builtin.command: incus profile create isolated --project {{ item.item }}
      when: item.rc != 0
      changed_when: true
      loop: "{{ profile.results }}"
      loop_control: { label: "{{ item.item }}" }

    - name: Isolated profiles match
      ansible.builtin.command:
        cmd: incus profile edit isolated --project {{ item.item }}
        stdin: "{{ isolated_profile | to_nice_yaml }}"
      when: >-
        item.rc != 0 or
        (item.stdout | from_yaml).config != isolated_profile.config or
        (item.stdout | from_yaml).devices != isolated_profile.devices
      changed_when: true
      loop: "{{ profile.results }}"
      loop_control: { label: "{{ item.item }}" }

    # The spawner logs in to Incus over its API with a certificate, so the API
    # listens, on loopback only.
    - name: Look for the Incus API address
      ansible.builtin.command: incus config get core.https_address
      register: https_address
      changed_when: false
      check_mode: false

    - name: Incus API on loopback
      ansible.builtin.command: incus config set core.https_address 127.0.0.1:8443
      when: https_address.stdout != "127.0.0.1:8443"
      changed_when: true

    # No login, no sudo, no incus group. Its home holds the state file, the
    # leaderboard and its Incus client config.
    - name: Spawner user
      ansible.builtin.user:
        name: handover
        system: true
        home: /var/lib/handover
        shell: /usr/sbin/nologin
        create_home: true

    - name: Spawner home is private
      ansible.builtin.file:
        path: /var/lib/handover
        state: directory
        owner: handover
        group: handover
        mode: "0700"

    # deploy.yml copies the code here as ubuntu; the spawner can read it, not change it.
    - name: Spawner code directory
      ansible.builtin.file:
        path: /opt/handover
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    # deploy.yml writes spawner.env here; systemd reads it as root.
    - name: Spawner secrets directory
      ansible.builtin.file:
        path: /etc/handover
        state: directory
        owner: root
        group: root
        mode: "0700"

    # The launch lock is shared with switch-image.sh (run as ubuntu). /run/lock
    # is emptied at boot, and a lock the spawner created would be 0600 handover.
    - name: Launch lock survives reboots, usable by both
      ansible.builtin.copy:
        dest: /etc/tmpfiles.d/handover.conf
        mode: "0644"
        content: |
          f /run/lock/handover-launch 0666 root root -
      notify: Create launch lock

    - name: Spawner client certificate
      ansible.builtin.command: runuser -u handover -- env HOME=/var/lib/handover incus remote generate-certificate
      args:
        creates: /var/lib/handover/.config/incus/client.crt

    - name: Spawner certificate fingerprint
      ansible.builtin.shell: >-
        set -o pipefail;
        openssl x509 -noout -fingerprint -sha256 -in /var/lib/handover/.config/incus/client.crt
        | cut -d= -f2 | tr -d : | tr A-F a-f
      args: { executable: /bin/bash }
      register: spawner_cert
      changed_when: false
      check_mode: false

    - name: Look for the spawner certificate in the trust store
      ansible.builtin.command: incus config trust show {{ spawner_cert.stdout }}
      register: spawner_trust
      changed_when: false
      failed_when: spawner_trust.rc not in [0, 1]
      check_mode: false

    - name: Spawner certificate trusted for the handover project only
      ansible.builtin.command: >-
        incus config trust add-certificate /var/lib/handover/.config/incus/client.crt
        --restricted --projects handover --name handover-spawner
      when: spawner_trust.rc != 0
      changed_when: true

    - name: Look for the spawner's Incus remote
      ansible.builtin.command: runuser -u handover -- env HOME=/var/lib/handover incus remote get-default
      register: spawner_remote
      changed_when: false
      check_mode: false

    - name: Spawner's Incus remote
      ansible.builtin.shell: |
        set -eo pipefail
        h() { runuser -u handover -- env HOME=/var/lib/handover incus "$@"; }
        h remote list -f csv | grep -q '^game,' ||
          h remote add game https://127.0.0.1:8443 --accept-certificate --project handover
        h remote switch game
      args: { executable: /bin/bash }
      when: spawner_remote.stdout != "game"
      changed_when: true

    # One-off move from the spawner that ran as ubuntu (2026-10-23): no-op once
    # /var/lib/handover has the leaderboard. Live boxes are in the default
    # project, which the new spawner can't see: they're deleted, and players
    # resume from their saves. The old DB stays as *.migrated until checked.
    - name: Look for the old leaderboard
      ansible.builtin.stat:
        path: /home/ubuntu/handover-leaderboard.db
      register: old_db

    - name: Look for the new leaderboard
      ansible.builtin.stat:
        path: /var/lib/handover/handover-leaderboard.db
      register: new_db

    - name: Move from the ubuntu-run spawner
      when: old_db.stat.exists and not new_db.stat.exists
      block:
        - name: Old spawner stopped
          ansible.builtin.systemd:
            name: handover-spawner
            state: stopped

        - name: Old boxes deleted
          ansible.builtin.shell: |
            set -o pipefail
            incus list -c n -f csv --project default | grep -E '^(p|w)-' |
              xargs -r -n1 incus delete -f --project default
          args: { executable: /bin/bash }
          changed_when: true

        - name: Leaderboard moved
          ansible.builtin.copy:
            src: /home/ubuntu/handover-leaderboard.db
            dest: /var/lib/handover/handover-leaderboard.db
            remote_src: true
            owner: handover
            group: handover
            mode: "0600"

        - name: Old leaderboard kept aside
          ansible.builtin.command: mv /home/ubuntu/handover-leaderboard.db /home/ubuntu/handover-leaderboard.db.migrated
          changed_when: true

        - name: Old state, code and secrets removed
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /home/ubuntu/.handover-sessions.json
            - /home/ubuntu/handover-spawner.env
            - /home/ubuntu/spawner.py
            - /home/ubuntu/common.py
            - /home/ubuntu/auth.py
            - /home/ubuntu/metrics.py
            - /home/ubuntu/gamedata.py
            - /home/ubuntu/pages
            - /home/ubuntu/static

    # Connector for the Terraform-made tunnel: its routes live in Cloudflare
    # (infra/tunnel.tf), so the host holds only the run token. No privileges.
    - name: Tunnel connector directory
      ansible.builtin.file:
        path: /etc/cloudflared
        state: directory
        mode: "0755"
      when: tunnel_token | length > 0

    - name: Tunnel connector token
      ansible.builtin.copy:
        dest: /etc/cloudflared/handover-tf.env
        content: "TUNNEL_TOKEN={{ tunnel_token }}\n"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: tunnel_token | length > 0
      notify: Restart tunnel connector

    - name: Tunnel connector unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/cloudflared-tf.service
        mode: "0644"
        content: |
          [Unit]
          Description=Cloudflare tunnel handover-tf (routes managed in Terraform)
          After=network-online.target
          Wants=network-online.target
          ConditionPathExists=/etc/cloudflared/handover-tf.env
          [Service]
          EnvironmentFile=/etc/cloudflared/handover-tf.env
          ExecStart=/usr/bin/cloudflared --no-autoupdate tunnel run
          DynamicUser=yes
          Restart=on-failure
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
      when: tunnel_token | length > 0
      notify: Restart tunnel connector

    - name: Tunnel connector running
      ansible.builtin.systemd:
        name: cloudflared-tf
        enabled: true
        state: started
        daemon_reload: true
      when: tunnel_token | length > 0

    # The old file-configured tunnel (replaced by handover-tf on 2026-10-18):
    # its connector, config, credentials and the account-level cert.pem go.
    - name: Look for the old tunnel connector
      ansible.builtin.stat:
        path: /etc/systemd/system/cloudflared-handover.service
      register: old_connector

    - name: Old tunnel connector off
      ansible.builtin.systemd:
        name: cloudflared-handover
        state: stopped
        enabled: false
      when: old_connector.stat.exists

    - name: Old tunnel files removed
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/cloudflared-handover.service
        - /home/ubuntu/.cloudflared
      notify: Reload systemd

    # Host metrics for the OKE Prometheus, which scrapes them through the
    # tunnel (handover-node, Access service token). Localhost only.
    - name: Node exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        install_recommends: false
        state: present

    # Textfile metrics (*.prom) from this host's own jobs: the pending-reboot
    # clock below and the nightly backup (backup.yml). Alerts in oke-gitops.
    - name: Node exporter listens on localhost only, reads textfile metrics
      ansible.builtin.copy:
        dest: /etc/default/prometheus-node-exporter
        content: |
          ARGS="--web.listen-address=127.0.0.1:9100 --collector.textfile.directory=/var/lib/prometheus/node-exporter"
        mode: "0644"
      notify: Restart node exporter

    - name: Textfile metrics directory
      ansible.builtin.file:
        path: /var/lib/prometheus/node-exporter
        state: directory
        owner: root
        group: root
        mode: "0755"

    # deploy.yml restarts the spawner after copying its code.
    - name: Spawner unit
      ansible.builtin.copy:
        src: ../spawner/handover-spawner.service
        dest: /etc/systemd/system/handover-spawner.service
        mode: "0644"
      notify: Reload systemd

    # Unattended upgrades install kernels but never reboot, and player
    # containers share the host kernel, so pending kernels must take effect.
    # Every night at 04:00 Israel time: reboot if one is pending and nobody is
    # playing; otherwise try next night, but after 72 h reboot anyway with a
    # 10-minute warning in every open terminal (players resume afterwards).
    - name: Reboot-when-needed script
      ansible.builtin.copy:
        dest: /usr/local/sbin/handover-maybe-reboot
        mode: "0755"
        content: |
          #!/bin/sh
          # Managed by host/site.yml. DRY_RUN=1 prints the decision only.
          # A pending reboot waits for a night with nobody playing, but at most
          # MAX_WAIT_H hours: then every open terminal is warned and it reboots
          # NOTICE_MIN minutes later. Players resume from their saves.
          MAX_WAIT_H=${MAX_WAIT_H:-72}
          NOTICE_MIN=${NOTICE_MIN:-10}
          # When this script first saw the pending reboot. Not the age of
          # /run/reboot-required: Ubuntu rewrites that for every new package
          # needing a reboot, so steady updates would reset the clock. /run is
          # emptied at boot, so the marker goes with the reboot.
          since=/run/handover-reboot-pending-since
          # For the HandoverRebootOverdue alert: when the pending reboot was first
          # seen, 0 for none. Stale after a reboot until tonight's run; the alert
          # ignores a value older than the boot.
          prom=/var/lib/prometheus/node-exporter/handover_reboot.prom
          metric() {
            m=handover_reboot_pending_since_seconds
            printf '# HELP %s When a pending reboot was first seen (0: none).\n# TYPE %s gauge\n%s %s\n' \
              "$m" "$m" "$m" "$1" > "$prom.tmp" && mv "$prom.tmp" "$prom"
          }
          [ -f /run/reboot-required ] || { rm -f "$since"; metric 0; echo "no reboot pending"; exit 0; }
          [ -f "$since" ] || date +%s > "$since"
          metric "$(cat "$since")"
          waited_h=$(( ($(date +%s) - $(cat "$since")) / 3600 ))
          why=$(tr '\n' ' ' < /run/reboot-required.pkgs 2>/dev/null)
          players=$(curl -s -m 5 http://127.0.0.1:8080/healthz |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["players"])' 2>/dev/null)
          if [ "$players" != 0 ]; then
            if [ "$waited_h" -lt "$MAX_WAIT_H" ]; then
              logger -t handover-reboot -s "reboot pending ${waited_h}h ($why), players=${players:-unknown}: next night (forced after ${MAX_WAIT_H}h)"
              exit 0
            fi
            logger -t handover-reboot -s "reboot pending ${waited_h}h ($why), players=${players:-unknown}: warning terminals, rebooting in ${NOTICE_MIN} min"
            if [ -z "${DRY_RUN:-}" ]; then
              msg="\r\n*** The Handover: this server restarts in ${NOTICE_MIN} minutes for a security update."
              msg="$msg Your progress is saved: press Play again afterwards to resume. ***\r\n"
              for c in $(incus list --project handover -c n -f csv); do
                incus exec --project handover "$c" -- sh -c 'for t in /dev/pts/[0-9]*; do printf "$1" > "$t"; done' sh "$msg" </dev/null 2>/dev/null || true
              done
              sleep $((NOTICE_MIN * 60))
            fi
          fi
          logger -t handover-reboot -s "rebooting for: $why"
          [ -n "${DRY_RUN:-}" ] || systemctl reboot

    - name: Reboot-when-needed service and timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/handover-maybe-reboot.{{ item.ext }}"
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - ext: service
          content: |
            [Unit]
            Description=Reboot for pending updates when nobody is playing
            [Service]
            Type=oneshot
            ExecStart=/usr/local/sbin/handover-maybe-reboot
        - ext: timer
          content: |
            [Unit]
            Description=Nightly check for a pending reboot
            [Timer]
            OnCalendar=*-*-* 04:00:00 Asia/Jerusalem
            [Install]
            WantedBy=timers.target
      notify: Reload systemd

    - name: Reboot-when-needed timer on
      ansible.builtin.systemd:
        name: handover-maybe-reboot.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Services enabled
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
      loop: [incus, handover-spawner, prometheus-node-exporter]
