---
# Host config for the Handover box (OCI A1, Ubuntu 24.04 ARM): everything the
# spawner and player containers rely on, applied by deploy.yml before the
# spawner is copied. Idempotent: on the live box a run reports no changes.
#
#   ansible-playbook -i <host>, -u ubuntu --private-key <key> host/site.yml --check --diff
#
# Not here: the spawner code, tunnel config and secrets (deploy.yml), the game
# image (bandit-wannabe's deploy-image), the instance itself (infra/).
- name: Handover host
  hosts: all
  become: true
  vars:
    cloudflared_version: "2026.10.1"
    # Run token for the Terraform-made tunnel (infra/tunnel.tf). deploy.yml
    # passes it from the CF_TUNNEL_TOKEN secret; when absent (e.g. a dry run
    # from a laptop) the connector tasks are skipped.
    tunnel_token: "{{ lookup('ansible.builtin.env', 'CF_TUNNEL_TOKEN') }}"
    pool_size: 30GiB
    isolated_profile:
      config:
        limits.cpu.allowance: 50%
        limits.memory: 512MiB
        limits.processes: "300"
        # The game never uses /dev/incus/sock; it would leak the host name.
        security.guestapi: "false"
        # Each box its own uid range: per-uid host limits (inotify) aren't
        # shared across boxes, and an escape lands in no other box's uids.
        security.idmap.isolated: "true"
      devices:
        eth0: { type: none }        # no NIC: isolation by absence
        # ~50 MiB used per player in practice (btrfs shares the image); 40 x 512
        # MiB fits the 30 GiB pool, so a full house of full quotas cannot fill it.
        root: { path: /, pool: games, size: 512MiB, type: disk }

  handlers:
    - name: Apply sysctls
      ansible.builtin.command: sysctl --system
      changed_when: true

    - name: Restart fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart tunnel connector
      ansible.builtin.systemd:
        name: cloudflared-tf
        state: restarted
        daemon_reload: true

  tasks:
    - name: Packages
      ansible.builtin.apt:
        name: [incus, incus-client, btrfs-progs, ttyd, python3-aiohttp, fail2ban]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Cloudflared (pinned)
      ansible.builtin.apt:
        deb: "https://github.com/cloudflare/cloudflared/releases/download/{{ cloudflared_version }}/cloudflared-linux-arm64.deb"
      notify: Restart tunnel connector

    # Every nested `ssh levelN@localhost` starts a systemd user manager; the
    # stock 128 inotify instances run out by about level 2. ptrace_scope and
    # dmesg_restrict can't be set inside a container, so the host enforces them.
    - name: Sysctls
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-handover.conf
        mode: "0644"
        content: |
          fs.inotify.max_user_instances = 8192
          fs.inotify.max_user_watches = 524288
          kernel.yama.ptrace_scope = 1
          kernel.dmesg_restrict = 1
      notify: Apply sysctls

    # SSH is key-only, so this is about log noise and connection churn.
    - name: Fail2ban sshd jail
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        mode: "0644"
        content: |
          [sshd]
          enabled  = true
          backend  = systemd
          maxretry = 5
          findtime = 10m
          bantime  = 1h
      notify: Restart fail2ban

    - name: Fail2ban running
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started

    # Pulled in as a dependency; nothing uses RPC and it's a reflection vector.
    - name: Rpcbind off
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop: [rpcbind.service, rpcbind.socket]

    # One key per repo's deploy workflow, so a leaked key is revoked by deleting
    # one file here, without touching the admin key. Keys only added, never
    # removed by omission: drop a file to revoke it (and the task's loop entry).
    - name: Deploy keys
      ansible.builtin.lineinfile:
        path: /home/ubuntu/.ssh/authorized_keys
        line: "{{ lookup('file', 'deploy-keys/' + item + '.pub') }}"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      loop: [bandit-wannabe, handover-hosting]

    - name: Ubuntu manages Incus
      ansible.builtin.user:
        name: ubuntu
        groups: incus-admin
        append: true

    - name: Incus is initialised
      ansible.builtin.command: incus admin init --minimal
      args:
        creates: /var/lib/incus/storage-pools/default

    - name: Look for the games pool
      ansible.builtin.command: incus storage show games
      register: games_pool
      changed_when: false
      failed_when: games_pool.rc not in [0, 1]
      check_mode: false

    # btrfs: per-container disk quotas, and clones share the base image.
    - name: Games pool
      ansible.builtin.command: incus storage create games btrfs size={{ pool_size }}
      when: games_pool.rc != 0
      changed_when: true

    - name: Look for the isolated profile
      ansible.builtin.command: incus profile show isolated
      register: profile
      changed_when: false
      failed_when: profile.rc not in [0, 1]
      check_mode: false

    - name: Isolated profile exists
      ansible.builtin.command: incus profile create isolated
      when: profile.rc != 0
      changed_when: true

    - name: Isolated profile matches
      ansible.builtin.command:
        cmd: incus profile edit isolated
        stdin: "{{ isolated_profile | to_nice_yaml }}"
      when: >-
        profile.rc != 0 or
        (profile.stdout | from_yaml).config != isolated_profile.config or
        (profile.stdout | from_yaml).devices != isolated_profile.devices
      changed_when: true

    # Connector for the Terraform-made tunnel: its routes live in Cloudflare
    # (infra/tunnel.tf), so the host holds only the run token. No privileges.
    - name: Tunnel connector directory
      ansible.builtin.file:
        path: /etc/cloudflared
        state: directory
        mode: "0755"
      when: tunnel_token | length > 0

    - name: Tunnel connector token
      ansible.builtin.copy:
        dest: /etc/cloudflared/handover-tf.env
        content: "TUNNEL_TOKEN={{ tunnel_token }}\n"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: tunnel_token | length > 0
      notify: Restart tunnel connector

    - name: Tunnel connector unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/cloudflared-tf.service
        mode: "0644"
        content: |
          [Unit]
          Description=Cloudflare tunnel handover-tf (routes managed in Terraform)
          After=network-online.target
          Wants=network-online.target
          ConditionPathExists=/etc/cloudflared/handover-tf.env
          [Service]
          EnvironmentFile=/etc/cloudflared/handover-tf.env
          ExecStart=/usr/bin/cloudflared --no-autoupdate tunnel run
          DynamicUser=yes
          Restart=on-failure
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
      when: tunnel_token | length > 0
      notify: Restart tunnel connector

    - name: Tunnel connector running
      ansible.builtin.systemd:
        name: cloudflared-tf
        enabled: true
        state: started
        daemon_reload: true
      when: tunnel_token | length > 0

    # The old file-configured tunnel (replaced by handover-tf on 2026-10-18):
    # its connector, config, credentials and the account-level cert.pem go.
    - name: Look for the old tunnel connector
      ansible.builtin.stat:
        path: /etc/systemd/system/cloudflared-handover.service
      register: old_connector

    - name: Old tunnel connector off
      ansible.builtin.systemd:
        name: cloudflared-handover
        state: stopped
        enabled: false
      when: old_connector.stat.exists

    - name: Old tunnel files removed
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/cloudflared-handover.service
        - /home/ubuntu/.cloudflared
      notify: Reload systemd

    # deploy.yml restarts the spawner after copying its code.
    - name: Spawner unit
      ansible.builtin.copy:
        src: ../spawner/handover-spawner.service
        dest: /etc/systemd/system/handover-spawner.service
        mode: "0644"
      notify: Reload systemd

    # Unattended upgrades install kernels but never reboot, and player
    # containers share the host kernel, so pending kernels must take effect.
    # Every night at 04:00 Israel time: reboot only if one is pending and
    # nobody is playing (players resume afterwards); otherwise try next night.
    - name: Reboot-when-needed script
      ansible.builtin.copy:
        dest: /usr/local/sbin/handover-maybe-reboot
        mode: "0755"
        content: |
          #!/bin/sh
          # Managed by host/site.yml. DRY_RUN=1 prints the decision only.
          [ -f /run/reboot-required ] || { echo "no reboot pending"; exit 0; }
          why=$(tr '\n' ' ' < /run/reboot-required.pkgs 2>/dev/null)
          players=$(curl -s -m 5 http://127.0.0.1:8080/healthz |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["players"])' 2>/dev/null)
          if [ "$players" != 0 ]; then
            logger -t handover-reboot -s "reboot pending ($why), players=${players:-unknown}: next night"
            exit 0
          fi
          logger -t handover-reboot -s "rebooting for: $why"
          [ -n "${DRY_RUN:-}" ] || systemctl reboot

    - name: Reboot-when-needed service and timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/handover-maybe-reboot.{{ item.ext }}"
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - ext: service
          content: |
            [Unit]
            Description=Reboot for pending updates when nobody is playing
            [Service]
            Type=oneshot
            ExecStart=/usr/local/sbin/handover-maybe-reboot
        - ext: timer
          content: |
            [Unit]
            Description=Nightly check for a pending reboot
            [Timer]
            OnCalendar=*-*-* 04:00:00 Asia/Jerusalem
            [Install]
            WantedBy=timers.target
      notify: Reload systemd

    - name: Reboot-when-needed timer on
      ansible.builtin.systemd:
        name: handover-maybe-reboot.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Services enabled
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
      loop: [incus, handover-spawner]
